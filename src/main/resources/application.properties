spring.application.name=bloomatic-project

# ===============================
# DATABASE (MySQL)
# ===============================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/bloomatic_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=Ntrunghieu27

# Hikari pool (m?c ??nh c?a Spring Boot) ? tinh ch?nh nh? cho dev
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# spring.datasource.hikari.leak-detection-threshold=20000  # b?t khi c?n truy d?u rò r? connection

# ===============================
# JPA / Hibernate
# ===============================
# Hibernate 6 (Spring Boot 3+) t? suy ?oán dialect theo driver; ?? t??ng minh v?n OK:
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Dev nên dùng update (tránh m?t data). create ch? dùng khi b?n mu?n drop & t?o l?i schema.
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ??ng b? timezone (SQL & JSON)
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

# N?u dùng schema.sql/data.sql
spring.sql.init.mode=never
# spring.jpa.defer-datasource-initialization=true
# spring.sql.init.encoding=UTF-8

# ===============================
# Redis (gi? gh? TTL, optional n?u b?n ?ã cài Redis)
# ===============================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ===============================
# Web / Swagger / Actuator
# ===============================
# springdoc-openapi (?ã khai báo dependency trong build)
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator Health (ti?n ki?m tra nhanh)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ===============================
# Logging
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
# logging.level.org.springframework.security=DEBUG    # b?t khi debug security

# ===============================
# Security (dev t?m m?) ? ch? dùng khi b?n mu?n t?t auth ?? d?ng khung
# ===============================
# Dùng SecurityConfig cho phép/khóa endpoint. N?u mu?n m? toang dev:
# spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# JWT
app.jwt.secret=change_this_to_a_long_random_secret
app.jwt.expiration=86400000
